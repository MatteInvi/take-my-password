<th:block th:fragment="navbar">

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">TMP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link"  th:href="@{|/|}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/archive}">Archivio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{|/password|}">Generatore</a>
                    </li>
                </ul>
        <section sec:authorize="isAnonymous()">
            <a class="button-login-logout" th:href="@{/login}">Login</a>
            <a class="button-login-logout" th:href="@{/user/register}">Registrati</a>
        </section>

        <section sec:authorize="isAuthenticated()">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link me-2" th:href="@{|/user/show/${userLogged.id}|}">Info utente</a>
                </li>
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-primary" type="submit">Logout</button>
                </form>
            </ul>

        </section>
            </div>
        </div>
    </nav>
</th:block>
